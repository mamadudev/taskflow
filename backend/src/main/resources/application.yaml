spring:
  application:
    name: taskflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/taskflow_db}
    username: ${DB_USERNAME:taskflow_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

server:
  port: ${SERVER_PORT:8081}